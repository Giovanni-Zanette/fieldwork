<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><meta name="description" content="Fieldwork is your local document extraction workspace.">
  <title>Fieldwork — Document workspace</title>
  <link rel="icon" type="image/svg+xml" href="/static/fieldwork.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to workspace</a>
<header class="app-header">
  <a class="brand" href="/" aria-label="Fieldwork home"><img src="/static/fieldwork.svg" alt="" width="30" height="30"><span class="brand-wordmark"><strong>Fieldwork</strong><small>Created by Zanette.ai</small></span></a>
  <nav class="main-nav" aria-label="Workspace"><button data-view="documents" class="active" aria-current="page">Documents</button><button data-view="templates">Templates</button><button data-view="watch">Watch folders</button><button data-view="settings">Settings</button></nav>
  <div class="local-status"><span class="status-dot"></span><span>On this Mac</span><button id="help-button" class="icon-button" aria-label="Help and keyboard shortcuts"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.25C12 11.8 12 12.4 12 14m0 3h.01"/></svg></button></div>
</header>
<div id="connection-error" class="connection-error hidden" role="alert"></div>
<main id="main" tabindex="-1"><div class="loading-screen" role="status"><img src="/static/fieldwork.svg" alt="" width="40" height="40"><p>Opening your workspace…</p></div></main>
<div id="upload-overlay" class="upload-overlay hidden"><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5"/></svg><h2>Add documents</h2><p>Drop PDF, PNG or JPEG files to import them.</p></div></div>
<div id="notifications" class="notifications" aria-live="polite" aria-atomic="false"></div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<input id="file-picker" class="visually-hidden" type="file" accept="application/pdf,image/png,image/jpeg,image/tiff" multiple aria-label="Import documents">
<input id="template-picker" class="visually-hidden" type="file" accept="application/json,.json" aria-label="Import a template">
<input id="backup-picker" class="visually-hidden" type="file" accept="application/zip,.zip" aria-label="Restore a workspace backup">
</body></html>
